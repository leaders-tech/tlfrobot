<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" data-theme="workshop">
  <title>Reserve signal lamp — graphics only</title>
  <desc>Original Timo workshop vector artwork. Geometric paths and shapes only; no raster images.</desc>
  <g id="lamp-frame" data-part="lamp-frame">
    <rect x="12" y="9" width="40" height="46" rx="16" fill="#F8F6EE" data-fill-role="body" stroke="#21364B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="outline" />
    <line x1="24" y1="49" x2="40" y2="49" fill="none" stroke="#537486" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
  </g>
  <g id="lamp-off" data-part="lamp-off">
    <circle cx="32" cy="29" r="13" fill="#CCDCE2" data-fill-role="body-shade" stroke="#537486" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
    <line x1="27" y1="29" x2="37" y2="29" fill="none" stroke="#537486" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
  </g>
  <g id="lamp-on" data-part="lamp-on" opacity="0">
    <circle cx="32" cy="29" r="13" fill="#F2B24F" data-fill-role="paint" stroke="#21364B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="outline" />
    <circle cx="32" cy="29" r="5" fill="#F7D894" data-fill-role="paint-light" />
    <line x1="32" y1="13" x2="32" y2="16" transform="rotate(0 32 29)" fill="none" stroke="#BE833A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="paint-shade" />
    <line x1="32" y1="13" x2="32" y2="16" transform="rotate(90 32 29)" fill="none" stroke="#BE833A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="paint-shade" />
    <line x1="32" y1="13" x2="32" y2="16" transform="rotate(180 32 29)" fill="none" stroke="#BE833A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="paint-shade" />
    <line x1="32" y1="13" x2="32" y2="16" transform="rotate(270 32 29)" fill="none" stroke="#BE833A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="paint-shade" />
  </g>
</svg>