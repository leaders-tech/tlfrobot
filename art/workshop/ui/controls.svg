<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 192" width="256" height="192" role="img" data-theme="workshop">
  <title>Twelve interface controls — reusable SVG symbols</title>
  <desc>Original Timo workshop vector artwork. Geometric paths and shapes only; no raster images.</desc>
  <defs>
    <symbol id="play" viewBox="0 0 32 32">
      <g>
        <path d="M 10 5 L 26 16 L 10 27 Z" fill="#367FC1" data-fill-role="accent" stroke="#21364B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="outline" />
      </g>
    </symbol>
    <symbol id="pause" viewBox="0 0 32 32">
      <g>
        <rect x="7" y="5" width="6" height="22" rx="2" fill="#367FC1" data-fill-role="accent" />
        <rect x="19" y="5" width="6" height="22" rx="2" fill="#367FC1" data-fill-role="accent" />
      </g>
    </symbol>
    <symbol id="stop" viewBox="0 0 32 32">
      <g>
        <rect x="6" y="6" width="20" height="20" rx="4" fill="#537486" data-fill-role="frame" />
      </g>
    </symbol>
    <symbol id="step" viewBox="0 0 32 32">
      <g>
        <path d="M 5 6 L 21 16 L 5 26 Z" fill="#367FC1" data-fill-role="accent" stroke="#21364B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="outline" />
        <line x1="26" y1="6" x2="26" y2="26" fill="none" stroke="#21364B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="outline" />
      </g>
    </symbol>
    <symbol id="reset" viewBox="0 0 32 32">
      <g>
        <path d="M 25 11 A 10 10 0 1 0 26 21" fill="none" stroke="#367FC1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="accent" />
        <path d="M 25 5 V 12 H 18" fill="none" stroke="#367FC1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="accent" />
      </g>
    </symbol>
    <symbol id="history-back" viewBox="0 0 32 32">
      <g>
        <path d="M 23 7 L 12 16 L 23 25" fill="none" stroke="#537486" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
        <line x1="6" y1="7" x2="6" y2="25" fill="none" stroke="#537486" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
      </g>
    </symbol>
    <symbol id="history-forward" viewBox="0 0 32 32">
      <g>
        <path d="M 9 7 L 20 16 L 9 25" fill="none" stroke="#537486" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
        <line x1="26" y1="7" x2="26" y2="25" fill="none" stroke="#537486" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
      </g>
    </symbol>
    <symbol id="speed" viewBox="0 0 32 32">
      <g>
        <path d="M 6 25 A 12 12 0 1 1 26 25" fill="none" stroke="#537486" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
        <line x1="16" y1="18" x2="24" y2="10" fill="none" stroke="#367FC1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="accent" />
        <circle cx="16" cy="18" r="2.5" fill="#367FC1" data-fill-role="accent" />
        <circle cx="7" cy="17" r="1" fill="#537486" data-fill-role="frame" />
        <circle cx="11" cy="9" r="1" fill="#537486" data-fill-role="frame" />
        <circle cx="21" cy="8" r="1" fill="#537486" data-fill-role="frame" />
      </g>
    </symbol>
    <symbol id="zoom-in" viewBox="0 0 32 32">
      <g>
        <circle cx="14" cy="14" r="9" fill="none" stroke="#537486" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
        <line x1="21" y1="21" x2="28" y2="28" fill="none" stroke="#367FC1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="accent" />
        <line x1="10" y1="14" x2="18" y2="14" fill="none" stroke="#367FC1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="accent" />
        <line x1="14" y1="10" x2="14" y2="18" fill="none" stroke="#367FC1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="accent" />
      </g>
    </symbol>
    <symbol id="zoom-out" viewBox="0 0 32 32">
      <g>
        <circle cx="14" cy="14" r="9" fill="none" stroke="#537486" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
        <line x1="21" y1="21" x2="28" y2="28" fill="none" stroke="#367FC1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="accent" />
        <line x1="10" y1="14" x2="18" y2="14" fill="none" stroke="#367FC1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="accent" />
      </g>
    </symbol>
    <symbol id="fit" viewBox="0 0 32 32">
      <g>
        <path d="M 5 12 V 5 H 12" fill="none" stroke="#537486" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
        <path d="M 20 5 H 27 V 12" fill="none" stroke="#537486" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
        <path d="M 5 20 V 27 H 12" fill="none" stroke="#537486" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
        <path d="M 20 27 H 27 V 20" fill="none" stroke="#537486" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
        <circle cx="16" cy="16" r="3" fill="#367FC1" data-fill-role="accent" />
      </g>
    </symbol>
    <symbol id="settings" viewBox="0 0 32 32">
      <g>
        <path d="M 13 3 H 19 L 20 8 L 24 6 L 28 11 L 25 15 L 29 18 L 26 24 L 21 23 L 19 29 H 13 L 11 24 L 6 26 L 3 21 L 7 17 L 3 13 L 6 7 L 11 9 Z" fill="#CCDCE2" data-fill-role="body-shade" stroke="#537486" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
        <circle cx="16" cy="16" r="5" fill="#F8F6EE" data-fill-role="body" stroke="#367FC1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="accent" />
      </g>
    </symbol>
  </defs>
  <rect x="5" y="5" width="54" height="54" rx="14" fill="#E3F3F6" data-fill-role="accent-pale" />
  <use x="16" y="16" width="32" height="32" xlink:href="#play" />
  <rect x="69" y="5" width="54" height="54" rx="14" fill="#E3F3F6" data-fill-role="accent-pale" />
  <use x="80" y="16" width="32" height="32" xlink:href="#pause" />
  <rect x="133" y="5" width="54" height="54" rx="14" fill="#E3F3F6" data-fill-role="accent-pale" />
  <use x="144" y="16" width="32" height="32" xlink:href="#stop" />
  <rect x="197" y="5" width="54" height="54" rx="14" fill="#E3F3F6" data-fill-role="accent-pale" />
  <use x="208" y="16" width="32" height="32" xlink:href="#step" />
  <rect x="5" y="69" width="54" height="54" rx="14" fill="#E3F3F6" data-fill-role="accent-pale" />
  <use x="16" y="80" width="32" height="32" xlink:href="#reset" />
  <rect x="69" y="69" width="54" height="54" rx="14" fill="#E3F3F6" data-fill-role="accent-pale" />
  <use x="80" y="80" width="32" height="32" xlink:href="#history-back" />
  <rect x="133" y="69" width="54" height="54" rx="14" fill="#E3F3F6" data-fill-role="accent-pale" />
  <use x="144" y="80" width="32" height="32" xlink:href="#history-forward" />
  <rect x="197" y="69" width="54" height="54" rx="14" fill="#E3F3F6" data-fill-role="accent-pale" />
  <use x="208" y="80" width="32" height="32" xlink:href="#speed" />
  <rect x="5" y="133" width="54" height="54" rx="14" fill="#E3F3F6" data-fill-role="accent-pale" />
  <use x="16" y="144" width="32" height="32" xlink:href="#zoom-in" />
  <rect x="69" y="133" width="54" height="54" rx="14" fill="#E3F3F6" data-fill-role="accent-pale" />
  <use x="80" y="144" width="32" height="32" xlink:href="#zoom-out" />
  <rect x="133" y="133" width="54" height="54" rx="14" fill="#E3F3F6" data-fill-role="accent-pale" />
  <use x="144" y="144" width="32" height="32" xlink:href="#fit" />
  <rect x="197" y="133" width="54" height="54" rx="14" fill="#E3F3F6" data-fill-role="accent-pale" />
  <use x="208" y="144" width="32" height="32" xlink:href="#settings" />
</svg>