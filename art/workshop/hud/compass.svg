<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" data-theme="workshop">
  <title>Compass without baked-in letters</title>
  <desc>Original Timo workshop vector artwork. Geometric paths and shapes only; no raster images.</desc>
  <g id="compass-frame" data-part="compass-frame">
    <circle cx="32" cy="32" r="27" fill="#F8F6EE" data-fill-role="body" stroke="#21364B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="outline" />
    <circle cx="32" cy="32" r="22" fill="none" stroke="#CCDCE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="body-shade" />
    <line x1="32" y1="9" x2="32" y2="14" transform="rotate(0 32 32)" fill="none" stroke="#537486" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
    <line x1="32" y1="9" x2="32" y2="14" transform="rotate(90 32 32)" fill="none" stroke="#537486" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
    <line x1="32" y1="9" x2="32" y2="14" transform="rotate(180 32 32)" fill="none" stroke="#537486" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
    <line x1="32" y1="9" x2="32" y2="14" transform="rotate(270 32 32)" fill="none" stroke="#537486" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="frame" />
  </g>
  <g id="compass-pointer" data-part="compass-pointer">
    <path d="M 32 15 L 39 33 L 32 30 L 25 33 Z" fill="#F2B24F" data-fill-role="paint" stroke="#21364B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="outline" />
    <path d="M 32 49 L 38 33 L 32 35 L 26 33 Z" fill="#367FC1" data-fill-role="accent" stroke="#21364B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="outline" />
    <circle cx="32" cy="32" r="3.5" fill="#F8F6EE" data-fill-role="body" stroke="#21364B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="outline" />
  </g>
</svg>